services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: website_spell_checker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  languagetool:
    image: silviof/docker-languagetool:latest
    ports:
      - "8010:8010"

volumes:
  postgres_data:
